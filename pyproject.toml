[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxy-agent"
version = "1.0.0"
description = "Autonomous, production-grade AI coding agent CLI with zero-bloat architecture."
readme = "README.md"
authors = [{ name = "Arsham" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
]

[project.scripts]
oxy = "oxy.app:main"

[project.urls]
Homepage = "https://github.com/Arsham-x/oxy"
Repository = "https://github.com/Arsham-x/oxy.git"
Issues = "https://github.com/Arsham-x/oxy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["oxy*"]
