[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxy-agent"
version = "1.0.0"
description = "Autonomous, production-grade AI coding agent CLI with zero-bloat architecture."
readme = "README.md"
authors = [{ name = "Arsham" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.40.0,<3.0.0",
    "rich>=13.7.0,<16.0.0",
    "prompt_toolkit>=3.0.40,<4.0.0",
    "arabic-reshaper>=3.0.0,<4.0.0",
    "python-bidi>=0.4.2,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pyflakes>=3.0.0,<4.0.0",
]
test = [
    "pytest>=7.0.0,<9.0.0",
]

[project.scripts]
oxy = "oxy.app:main"

[project.urls]
Homepage = "https://github.com/Arsham-x/oxy"
Repository = "https://github.com/Arsham-x/oxy.git"
Issues = "https://github.com/Arsham-x/oxy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["oxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
